<title>TOEIC Day 2 – Vocabulary Practice</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#677189;--line:#dfe4ee;--accent:#315efb;--ok:#168a55;--bad:#cf3f4a;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:22px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(25px,4vw,38px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);margin-top:5px}.pill{padding:9px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px rgba(25,35,60,.06)}
aside{padding:16px;position:sticky;top:12px;align-self:start}main{padding:24px;min-height:650px}.menu{display:grid;gap:8px}
.menu button,.btn{width:100%;border:1px solid var(--line);background:#fff;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left;font-weight:700;color:var(--ink)}
.menu button:hover,.menu button.active{border-color:#aab8ff;background:var(--soft);color:var(--accent)}.stats{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.7}
.progress{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:var(--accent);width:0%;transition:.25s}.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mode-title{font-size:22px;font-weight:850}.kbd{font-size:12px;color:var(--muted)}kbd{background:#f0f2f6;border:1px solid #d8dde8;border-bottom-width:2px;padding:2px 6px;border-radius:6px;color:#45506a}
.card{margin-top:20px;padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#fbfcff)}.term{font-size:clamp(30px,5vw,48px);font-weight:900;letter-spacing:-.03em;margin:4px 0 6px}
.ipa{font-family:Georgia,serif;color:var(--accent);font-size:20px;margin-bottom:16px}.meaning{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.meaning>div{padding:13px;background:#f7f8fb;border-radius:12px}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.example{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:#f7f9ff;border-radius:10px;font-size:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.controls .btn{width:auto;text-align:center}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.good{background:#ecfff5;color:var(--ok);border-color:#b8ecd1}

.feedback{margin-top:16px;padding:14px;border-radius:12px;display:none;line-height:1.55}.feedback.ok{display:block;background:#effbf5;color:#116a44}.feedback.bad{display:block;background:#fff1f3;color:#a12834}.inputrow{display:flex;gap:10px;margin-top:20px}.inputrow input{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:12px;font-size:18px;outline:none}
.tag{display:inline-block;padding:5px 9px;background:#f0f3f9;color:#667085;border-radius:999px;font-size:12px;font-weight:700}.flash-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.flash-actions button{text-align:center}
.tablewrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:11px 9px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#fff}.miniSpeak{border:0;background:#eef2ff;color:#315efb;border-radius:8px;padding:6px 8px;cursor:pointer}.note{color:var(--muted);font-size:14px;line-height:1.55;margin-top:10px}
@media(max-width:820px){.grid{grid-template-columns:1fr}aside{position:static}.meaning{grid-template-columns:1fr}.kbd{display:none}}
</style>
</head>

pen", "ex": "The men have left their suitcases open.", "blank": "They have ___ the door open.", "answer": "left", "type": "grammar pattern"}, {"term": "entrance", "ipa": "/ˈentrəns/", "vi": "lối vào, cửa vào", "zh": "入口", "coll": "stand next to an entrance", "ex": "One of the women is standing next to an entrance.", "blank": "One of the women is standing next to an ___.", "answer": "entrance", "type": "noun"}, {"term": "count money", "ipa": "/kaʊnt ˈmʌni/", "vi": "đếm tiền", "zh": "数钱", "coll": "count money from a machine", "ex": "One of the women is counting money from a machine.", "blank": "One of the women is ___ money.", "answer": "counting", "type": "collocation"}, {"term": "inspect", "ipa": "/ɪnˈspekt/", "vi": "kiểm tra kỹ, xem xét", "zh": "检查", "coll": "inspect the contents of a box", "ex": "Some people are inspecting the contents of a box.", "blank": "Some people are ___ the contents of a box.", "answer": "inspecting", "type": "verb"}, {"term": "the contents", "ipa": "/ðə ˈkɑːntents/", "vi": "những thứ bên trong", "zh": "内容物；里面的东西", "coll": "the contents of a box", "ex": "They are inspecting the contents of a box.", "blank": "They are inspecting the ___ of a box.", "answer": "contents", "type": "noun"}, {"term": "lead a tour group", "ipa": "/liːd ə tʊr ɡruːp/", "vi": "dẫn một đoàn tham quan", "zh": "带领参观团", "coll": "lead a tour group", "ex": "The man is leading a tour group.", "blank": "The man is ___ a tour group.", "answer": "leading", "type": "collocation"}, {"term": "load something onto a truck", "ipa": "/loʊd ˈsʌmθɪŋ ˈɑːntuː ə trʌk/", "vi": "chất/xếp vật gì lên xe tải", "zh": "把某物装上卡车", "coll": "load a box onto a truck", "ex": "A box is being loaded onto a truck.", "blank": "A box is being ___ onto a truck.", "answer": "loaded", "type": "structure"}, {"term": "have fallen", "ipa": "/hæv ˈfɔːlən/", "vi": "đã rơi xuống", "zh": "已经掉落", "coll": "have fallen on the floor", "ex": "Some reading materials have fallen on the floor.", "blank": "Some reading materials have ___ on the floor.", "answer": "fallen", "type": "verb form"}, {"term": "in the corner", "ipa": "/ɪn ðə ˈkɔːrnər/", "vi": "ở trong góc", "zh": "在角落里", "coll": "stacked in the corner", "ex": "Some chairs are stacked in the corner.", "blank": "Some chairs are stacked in the ___.", "answer": "corner", "type": "prepositional phrase"}, {"term": "stacked", "ipa": "/stækt/", "vi": "được xếp chồng", "zh": "堆叠的", "coll": "chairs are stacked", "ex": "Some chairs are stacked in the corner.", "blank": "Some chairs are ___ in the corner.", "answer": "stacked", "type": "participle"}, {"term": "mounted", "ipa": "/ˈmaʊntɪd/", "vi": "được gắn/cố định lên bề mặt", "zh": "安装在……上的", "coll": "mounted on a wall", "ex": "Some light fixtures are mounted on a wall.", "blank": "Some light fixtures are ___ on a wall.", "answer": "mounted", "type": "participle"}, {"term": "on display", "ipa": "/ɑːn dɪˈspleɪ/", "vi": "được trưng bày", "zh": "陈列着", "coll": "on display in a window", "ex": "Some furniture is on display in a window.", "blank": "Some furniture is on ___ in a window.", "answer": "display", "type": "fixed phrase"}, {"term": "laid out", "ipa": "/leɪd aʊt/", "vi": "được bày/trải ra", "zh": "铺开；摆放好", "coll": "laid out on a bench", "ex": "Some place mats are laid out on a bench.", "blank": "Some place mats are ___ out on a bench.", "answer": "laid", "type": "phrasal verb"}, {"term": "propped up", "ipa": "/prɑːpt ʌp/", "vi": "được dựng/chống lên", "zh": "被支撑起来", "coll": "propped up on a shelf", "ex": "A clock has been propped up on a shelf.", "blank": "A clock has been ___ up on a shelf.", "answer": "propped", "type": "phrasal verb"}, {"term": "overlook", "ipa": "/ˌoʊvərˈlʊk/", "vi": "nhìn ra, nhìn xuống/ra", "zh": "俯瞰；眺望", "coll": "overlook a fishing pier", "ex": "A house overlooks a fishing pier.", "blank": "A house ___ a fishing pier.", "answer": "overlooks", "type": "verb"}, {"term": "cross over", "ipa": "/krɔːs ˈoʊvər/", "vi": "bắc/băng ngang qua", "zh": "横跨", "coll": "cross function renderToeic(){const v=current();const distractors=optionsFor('answer',v).filter(x=>x!==v.answer);const opts=shuffle([v.answer,...distractors.slice(0,3)]);return '<div class="card"><div class="label">TOEIC Part 1 · chọn từ hoàn thành câu</div><div class="example">'+esc(v.blank).replace('___','<b style="color:#315efb">_____</b>')+'</div><div class="choices">'+opts.map((o,i)=>'<button class="choice" onclick="choose(this,\''+safeJS(o)+'\')"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</button>').join('')+'</div><div id="fb"></div><div class="controls"><button class="btn primary" onclick="checkToeic()">Kiểm tra</button><button class="btn" onclick="speak(\''+safeJS(v.ex)+'\')">🔊 Nghe câu hoàn chỉnh</button><button class="btn" onclick="nextQ()">Câu tiếp</button></div></div>';}
function checkToeic(){if(checked)return nextQ();if(selected===null)return;checked=true;const v=current(),ok=normalize(selected)===normalize(v.answer);document.querySelectorAll('.choice').forEach(x=>{const raw=x.textContent.replace(/^[A-D]\.\s*/,'').trim();if(normalize(raw)===normalize(v.answer))x.classList.add('correct');else if(x.classList.contains('selected'))x.classList.add('wrong');});document.getElementById('fb').innerHTML=feedbackBox(ok,ok?'✅ Đúng. '+esc(v.ex):'❌ Đáp án: <b>'+esc(v.answer)+'</b><br>'+esc(v.ex)+'<br><small>'+esc(v.vi)+' · '+esc(v.zh)+'</small>');ok?correct++:wrong++;done++;setStats();}
function renderReview(){return '<div class="note">Nhấn 🔊 để nghe từng từ/cụm từ.</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Word / Phrase</th><th>IPA</th><th>中文</th><th>Tiếng Việt</th><th>Collocation</th><th>Nghe</th></tr></thead><tbody>'+vocab.map((v,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(v.term)+'</b></td><td>'+esc(v.ipa)+'</td><td>'+esc(v.zh)+'</td><td>'+esc(v.vi)+'</td><td>'+esc(v.coll)+'</td><td><button class="miniSpeak" onclick="speak(\''+safeJS(v.term)+'\')">🔊</button></td></tr>').join('')+'</tbody></table></div>';}
function render(){const titles={learn:'Học từ / Flashcard',meaning:'Chọn nghĩa đúng',cloze:'Điền từ',listen:'Nghe & chọn',toeic:'TOEIC sentence',review:'Xem toàn bộ từ'};document.getElementById('modeTitle').textContent=titles[mode];document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const app=document.getElementById('app');app.innerHTML=mode==='learn'?renderLearn():mode==='meaning'?renderMeaning():mode==='cloze'?renderCloze():mode==='listen'?renderListen():mode==='toeic'?renderToeic():renderReview();if(mode==='cloze')setTimeout(()=>document.getElementById('answerInput')?.focus(),50);if(mode==='listen')setTimeout(()=>speak(current().term),350);}
document.querySelectorAll('.menu button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;idx=0;selected=null;checked=false;shuffle(order);render();}));
document.addEventListener('keydown',e=>{if(e.target&&['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();checkCloze();}return;}if(e.code==='Space'){e.preventDefault();const v=current();speak((mode==='learn'||mode==='meaning'||mode==='listen')?v.term:v.ex);}if(['1','2','3','4'].includes(e.key)){const choices=[...document.querySelectorAll('.choice')];const c=choices[Number(e.key)-1];if(c)c.click();}if(e.key==='n'||e.key==='N')nextQ();if(e.key==='h'||e.key==='H'){if(mode==='cloze')showHint();}if(e.key==='Enter'){e.preventDefault();if(mode==='meaning')checkMeaning();else if(mode==='listen')checkListen();else if(mode==='toeic')checkToeic();else nextQ();}});
speechSynthesis.getVoices();setStats();render();
</script>
</body>
